name: scripture_library
description: A minimal Sanskrit scripture library and reader.
publish_to: none
version: 0.2.0+2

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  cloud_firestore: ^6.1.0
  firebase_core: ^4.3.0
  material_ui: ^1.11.1
  shared_preferences: ^2.5.4
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/launch_library.json
    - assets/LibreBaskerville-OFL.txt
  fonts:
    - family: Library Serif
      fonts:
        - asset: assets/LibreBaskerville.ttf
